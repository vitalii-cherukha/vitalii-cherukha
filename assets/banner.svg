<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 300" width="1200" height="300" role="img" aria-labelledby="t d">
  <title id="t">Vitalii Cherukha - Tech Lead, Full-Stack Developer</title>
  <desc id="d">ERP and CRM systems, servers and deploys, native iOS and Android games. Kyiv, Ukraine.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0d1117"/>
      <stop offset="1" stop-color="#151b26"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#58a6ff"/>
      <stop offset="1" stop-color="#bc8cff"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.82" cy="0.1" r="0.7">
      <stop offset="0" stop-color="#58a6ff" stop-opacity="0.20"/>
      <stop offset="1" stop-color="#58a6ff" stop-opacity="0"/>
    </radialGradient>
    <pattern id="dots" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="2" cy="2" r="1.1" fill="#30363d"/>
    </pattern>
    <clipPath id="card"><rect width="1200" height="300" rx="18"/></clipPath>
  </defs>
  <style>
    .sans { font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "Noto Sans", Helvetica, Arial, sans-serif; }
    .mono { font-family: ui-monospace, SFMono-Regular, "SF Mono", Menlo, Consolas, "Liberation Mono", monospace; }
    .muted { fill: #8b949e; }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    .dot { fill: #30363d; animation-duration: 9s; animation-iteration-count: infinite; animation-timing-function: ease-in-out; }
    .s1 { animation-name: s1; } .s2 { animation-name: s2; } .s3 { animation-name: s3; } .s4 { animation-name: s4; } .s5 { animation-name: s5; }
    @keyframes s1 { 0%, 4% { fill: #30363d; } 9%, 93% { fill: #3fb950; } 100% { fill: #30363d; } }
    @keyframes s2 { 0%, 18% { fill: #30363d; } 23%, 93% { fill: #3fb950; } 100% { fill: #30363d; } }
    @keyframes s3 { 0%, 32% { fill: #30363d; } 37%, 93% { fill: #3fb950; } 100% { fill: #30363d; } }
    @keyframes s4 { 0%, 46% { fill: #30363d; } 51%, 93% { fill: #3fb950; } 100% { fill: #30363d; } }
    @keyframes s5 { 0%, 60% { fill: #30363d; } 65%, 93% { fill: #3fb950; } 100% { fill: #30363d; } }
    .live { opacity: 0; animation: live 9s ease-in-out infinite; }
    @keyframes live { 0%, 64% { opacity: 0; } 70%, 93% { opacity: 1; } 100% { opacity: 0; } }
    @media (prefers-reduced-motion: reduce) {
      .cursor, .dot, .live { animation: none; }
      .dot { fill: #3fb950; }
      .live { opacity: 1; }
    }
  </style>

  <g clip-path="url(#card)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#dots)" opacity="0.55"/>
    <rect width="1200" height="300" fill="url(#glow)"/>
    <rect x="0" y="296" width="1200" height="4" fill="url(#accent)"/>
  </g>
  <rect x="0.5" y="0.5" width="1199" height="299" rx="18" fill="none" stroke="#30363d"/>

  <!-- Left: who -->
  <text x="56" y="70" class="mono muted" font-size="18"><tspan fill="#3fb950">$</tspan> whoami<tspan class="cursor" fill="#58a6ff"> _</tspan></text>
  <text x="54" y="140" class="sans" font-size="62" font-weight="700" fill="#f0f6fc">Vitalii Cherukha</text>
  <text x="56" y="186" class="sans" font-size="29" font-weight="600" fill="url(#accent)">Tech Lead · Full-Stack Developer</text>
  <text x="56" y="224" class="sans muted" font-size="19">ERP &amp; CRM systems · servers and deploys · native iOS/Android games</text>
  <rect x="56" y="247" width="24" height="8" rx="1.5" fill="#0057b7"/>
  <rect x="56" y="255" width="24" height="8" rx="1.5" fill="#ffd700"/>
  <text x="90" y="262" class="sans muted" font-size="17">Kyiv, Ukraine</text>

  <!-- Right: delivery pipeline -->
  <g transform="translate(852 46)">
    <rect width="292" height="212" rx="12" fill="#0d1117" fill-opacity="0.85" stroke="#30363d"/>
    <text x="22" y="34" class="mono muted" font-size="14">delivery pipeline</text>
    <line x1="30" y1="62" x2="30" y2="182" stroke="#30363d" stroke-width="2"/>
    <circle class="dot s1" cx="30" cy="62" r="7"/>
    <circle class="dot s2" cx="30" cy="92" r="7"/>
    <circle class="dot s3" cx="30" cy="122" r="7"/>
    <circle class="dot s4" cx="30" cy="152" r="7"/>
    <circle class="dot s5" cx="30" cy="182" r="7"/>
    <g class="mono" font-size="16" fill="#c9d1d9">
      <text x="52" y="67">spec</text>
      <text x="52" y="97">build + tests</text>
      <text x="52" y="127">code review</text>
      <text x="52" y="157">staging</text>
      <text x="52" y="187">production</text>
    </g>
    <g class="live">
      <rect x="196" y="171" width="58" height="22" rx="11" fill="#238636"/>
      <text x="225" y="187" class="mono" font-size="13" font-weight="700" fill="#ffffff" text-anchor="middle">live</text>
    </g>
  </g>
</svg>
